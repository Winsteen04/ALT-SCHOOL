<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALT SCHOOL APPLICATION FORM</title>
</head>
<body>
    <header id="top">
        <nav aria-label="main navigation">
            <a href="index.html">Home</a>
            <a href="form.html">Application Form</a>
            </nav>
        </header>
    
        <main>
            <section aria-labelledby="form-heading">
                <h1 id="form-heading">Sign Up</h1>
                <p>Please fill out the form below to apply for the AltSchool School of Engineering program.</p>
                <aside aria-label="information note">
                    <p><strong>Note:</strong> first name first then followed by last name</p>
                </aside>
                <form>
                    <!-- email address -->
                     <p>
                        <label for="email"> Email Address:</label> <br>
                        <input type="email" id="email" name="email" placeholder="johndoe@gmail.com" required>
                        </p>
                        <!-- first name -->
                        <p>
                        <label for="first-name">First Name:</label> <br>
                        <input type="text" id="first-name" name="first-name" placeholder="John" required>
                        </p>
                    <!-- last name -->
                     <p>
                        <label for="last-name">Last Name:</label> <br>
                        <input type="text" id="last-name" name="last-name" placeholder="Doe" required>
                        </p>
                    <!-- phone number -->
                        <p>
                            <label for="phone">Phone Number:</label> <br>
                            <input type="tel" id="phone" name="phone" placeholder="+234 123 456 7890" required>
                            </p>
                            <!-- password -->
                             <p>
                                <label for="password">Password:</label> <br>
                                <input type="password" id="password" name="password" placeholder="********" required>
                             </p>
                             <!-- confirm password -->
                                <p>
                                    <label for="confirm-password">Confirm Password:</label> <br>
                                    <input type="password" id="confirm-password" name="confirm-password" placeholder="********" required>
                                    </p>
                                    <!-- terms and privacy statement -->
                                     <p>
                                        <input type="checkbox" id="terms" name="terms" required>
                                        <label for="terms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.</label>
                                     </p>
                                        
                                     <button type="submit">create account &rarr;</button>
                </form>
                </section>
            
        </main>
        <footer>
            <p><a href="#top">Back to top</a></p>
            <hr>
            <address>
                ojota ,laagos, nigeria <br>
                <p>Contact us: <a href="mailto:winstonubong@gmail.com">winstonubong@gmail.com</a></p>
            </address>
            <p>&copy; 2026 Udo Winston. All rights reserved.</p>

            </p>
        </footer>
    
</body>
</html>
